<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VN Mobile – Portrait</title>
  </head>
  <body>
    <main class="portrait">
      <div class="zone" id="background-zone"><canvas></canvas></div>
      <div class="zone" id="text-zone">
        <!-- The speaker's name read by OCR, on the message window's top-left
             corner (see portrait.ts). -->
        <div id="name-tag">
          <span id="name-text"></span>
        </div>
        <!-- The line read by OCR (see portrait.ts). -->
        <p id="text-line" class="message-window glass"></p>
        <!-- The "tap to continue" arrow in the message window's corner. It
             holds every arrow shape; portrait.css shows the one picked in
             the picker's Style settings. Outside #text-line, because setting
             the line's text would remove anything inside it. -->
        <span id="next-arrow" class="next-arrow" aria-hidden="true">
          <svg class="chevron" viewBox="0 0 24 24">
            <path d="M5 9l7 7 7-7" />
          </svg>
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="triangle"></span>
          <span class="ember"></span>
          <span class="drop"></span>
          <!-- A big heart and a small one, like MiSide's menu cursor. -->
          <svg class="hearts" viewBox="0 0 32 32">
            <path
              transform="translate(0 2) rotate(-12 10 12) scale(0.85)"
              d="M12 21s-7.5-4.6-9.6-9.2C.9 8.2 3.2 4.5 6.8 4.5c2.1 0 3.6 1.2 4.2 2.6.6-1.4 2.1-2.6 4.2-2.6 3.6 0 5.9 3.7 4.4 7.3C19.5 16.4 12 21 12 21z"
            />
            <path
              transform="translate(16 15) rotate(12 7 7) scale(0.6)"
              d="M12 21s-7.5-4.6-9.6-9.2C.9 8.2 3.2 4.5 6.8 4.5c2.1 0 3.6 1.2 4.2 2.6.6-1.4 2.1-2.6 4.2-2.6 3.6 0 5.9 3.7 4.4 7.3C19.5 16.4 12 21 12 21z"
            />
          </svg>
        </span>
      </div>

      <!-- Menus mode only (the `raw-mode` class): an empty box under the
           corner buttons that the whole game is drawn into (portrait.ts),
           and the settings sheet below it (menus-sheet.ts). -->
      <div id="game-slot"></div>
      <section id="menus-sheet" class="glass" aria-label="Settings">
        <h2>Look</h2>
        <!-- A sample message window in the picked look, since the real one
             is hidden in Menus mode. -->
        <div id="look-preview">
          <div class="name-tag">Name</div>
          <p class="message-window glass">
            The text will look like this.
            <span class="next-arrow" aria-hidden="true"></span>
          </p>
        </div>
        <!-- Each row is filled with a button per option (menus-sheet.ts). -->
        <h3 id="theme-heading">Theme</h3>
        <div
          id="theme-chips"
          class="chips"
          role="radiogroup"
          aria-labelledby="theme-heading"
        ></div>
        <h3 id="arrow-heading">Arrow</h3>
        <div
          id="arrow-chips"
          class="chips"
          role="radiogroup"
          aria-labelledby="arrow-heading"
        ></div>
        <h3 id="border-heading">Border</h3>
        <div
          id="border-chips"
          class="chips"
          role="radiogroup"
          aria-labelledby="border-heading"
        ></div>
        <p class="sheet-note">Changes are saved for every game.</p>
      </section>

      <!-- Switches between the reader layout and the whole game (portrait.ts).
           Shows whichever it switches to. -->
      <button
        id="raw-button"
        class="corner-button glass"
        aria-label="Menus: show the whole game"
      >
        <svg class="to-raw" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 5h18v12H3zM8 21h8M12 17v4" />
        </svg>
        <svg class="to-reader" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16M4 10h16M4 15h10M4 20h7" />
        </svg>
        <span class="to-raw">Menus</span>
        <span class="to-reader">Reader</span>
      </button>

      <!-- Opens the history log (history-log.ts). -->
      <button
        id="log-button"
        class="corner-button glass"
        aria-label="History log"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 3" />
        </svg>
        Log
      </button>

      <!-- The history log: one past line at a time, with big buttons to step
           back and forward. A <dialog> sits on top of the whole page and
           blocks taps to it while open. -->
      <dialog id="log" aria-label="History log">
        <button id="log-close" class="glass">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
          Return to game
        </button>
        <div id="log-message" class="glass">
          <!-- "8 / 9", with who said the line beside it. -->
          <div id="log-heading">
            <p id="log-count"></p>
            <p id="log-speaker"></p>
          </div>
          <p id="log-text"></p>
        </div>
        <button id="log-older" class="log-arrow" aria-label="Older line">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </button>
        <button id="log-newer" class="log-arrow" aria-label="Newer line">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </dialog>
    </main>
    <p id="status">Pick a window in the main window to start.</p>
    <script type="module" src="/src/portrait.ts"></script>
  </body>
</html>
