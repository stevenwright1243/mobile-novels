<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>VN Mobile</title>
  </head>
  <body>
    <header>
      <h1>Pick a window</h1>
      <button id="refresh">Refresh</button>
      <button id="set-text-zone" disabled>Set text zone</button>
    </header>
    <ul id="window-list"></ul>
    <div id="preview-area">
      <video id="preview" autoplay muted></video>
      <!-- Sized by renderer.ts to sit exactly over the game picture. -->
      <div id="frame">
        <div id="text-outline"></div>
      </div>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
